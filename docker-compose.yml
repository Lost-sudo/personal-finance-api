services:
  postgres:
    image: postgres:18-alpine
    container_name: personal-finance-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: personal_finance
      POSTGRES_USER: finance_app
      POSTGRES_PASSWORD: finance_dev_password

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance_app -d personal_finance"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data: